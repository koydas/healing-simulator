# Configuration Nginx du conteneur (serveur statique, non-root, port 8080).

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Le conteneur tourne en lecture seule : les chemins temporaires sont
    # fournis par des volumes (voir k8s/deployment.yaml).
    client_body_temp_path /tmp/nginx-client-body;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Sonde de santé Kubernetes — répond 200 sans toucher au disque.
    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "OK\n";
    }

    # Les assets buildés sont hashés : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fallback SPA : toute route inconnue renvoie index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    error_page 404 /index.html;
}
