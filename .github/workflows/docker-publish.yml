name: docker-publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/koydas/healing-simulator:${{ steps.vars.outputs.sha }}
            ghcr.io/koydas/healing-simulator:latest

      # Bumping the tag here (rather than leaving the Deployment on :latest)
      # is what makes this a Git commit ArgoCD can actually sync on --
      # see docs/adr/0012.
      - name: Update deployment image tag
        run: |
          sed -i "s|ghcr.io/koydas/healing-simulator:.*|ghcr.io/koydas/healing-simulator:${{ steps.vars.outputs.sha }}|" k8s/deployment.yaml

      # main is ruleset-protected (PR required, no direct push, no bypass
      # available for the GitHub Actions app on a personal-account repo --
      # see docs/adr/0013). Open a same-repo PR and merge it immediately
      # instead of pushing straight to main.
      - name: Open and merge a deploy PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest change, skipping deploy PR."
            exit 0
          fi
          BRANCH="deploy/${{ steps.vars.outputs.sha }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: deploy ${{ steps.vars.outputs.sha }}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: deploy ${{ steps.vars.outputs.sha }}" \
            --body "Automated image tag bump to ghcr.io/koydas/healing-simulator:${{ steps.vars.outputs.sha }}."
          gh pr merge "$BRANCH" --squash --delete-branch
