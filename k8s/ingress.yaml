apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healing-simulator
  labels:
    app.kubernetes.io/name: healing-simulator
spec:
  # Adjust the IngressClass name to the target cluster (nginx, traefik, ...).
  ingressClassName: nginx
  rules:
    - host: healing-simulator.local
      http:
        paths:
          # Requests must reach the container at `/`. Serving under a sub-path
          # requires either an Ingress that strips the prefix, or a build made
          # with `vite build --base=/<prefix>/` — see docs/deployment.md.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healing-simulator
                port:
                  name: http
