apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healing-simulator
  labels:
    app.kubernetes.io/name: healing-simulator
spec:
  # Adjust the IngressClass name to the target cluster (nginx, traefik, ...).
  ingressClassName: nginx
  rules:
    - host: healing-simulator.local
      http:
        paths:
          # Requests must reach the container at `/`. Serving under a sub-path
          # requires BOTH a build made with `vite build --base=/<prefix>/` and
          # an Ingress that strips the prefix; either one alone leaves the
          # browser asking for assets the container does not serve.
          # See docs/deployment.md and docs/adr/0011-root-relative-asset-base.md.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healing-simulator
                port:
                  name: http
